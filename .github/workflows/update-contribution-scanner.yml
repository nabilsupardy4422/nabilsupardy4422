name: Update Contribution Scanner

on:
  schedule:
    # Setiap hari pukul 08:30 WIB (01:30 UTC)
    - cron: "30 1 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/generate_contribution_scanner.py"
      - ".github/workflows/update-contribution-scanner.yml"

permissions:
  contents: write

jobs:
  update-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Generate contribution scanner
        env:
          GITHUB_USERNAME: nabilsupardy4422
        run: |
          python scripts/generate_contribution_scanner.py

      - name: Commit updated GIF
        run: |
          if [ -z "$(git status --porcelain -- assets/github-cyber-scanner.gif)" ]; then
            echo "No contribution data change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-cyber-scanner.gif
          git commit -m "chore: update contribution scanner"
          git push
